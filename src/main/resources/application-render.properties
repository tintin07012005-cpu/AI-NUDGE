
server.port=${PORT:8080}
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=365d
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

ainudge.remember-secret=${AINUDGE_REMEMBERSECRET}
ainudge.teacher-password=${AINUDGE_TEACHERPASSWORD}
ainudge.demo=false
ainudge.monitor-pin=${AINUDGE_MONITORPIN}
ainudge.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

ainudge.vapid-public=${AINUDGE_VAPIDPUBLIC}
ainudge.vapid-private=${AINUDGE_VAPIDPRIVATE}
ainudge.vapid-subject=mailto:ainudge2026@gmail.com

ainudge.public-url=${AINUDGE_PUBLICURL:}
ainudge.mail.always=false
